name: Build & Release

on:
  push:
    branches:
      - 'feature/**'
      - 'dev'
      - 'main'
  workflow_dispatch:

concurrency:
  group: build-quick-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: ${{ vars.TERMUX_APP_VERSION_NAME || '0.2.29-hotfix.1' }}

jobs:
  build:
    strategy:
      matrix:
        variant: [apt, pacman]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: app/release.keystore
          key: release-keystore

      - name: Create release keystore (if not exists)
        run: |
          KEYSTORE_FILE="app/release.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -alias termux-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass termux123 -keypass termux123 \
              -dname "CN=Termux Split, OU=Dev, O=Termux, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build APK (${{ matrix.variant }})
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.variant == 'apt' && 'apt-android-7' || 'pacman-android-7' }}
          TERMUX_RELEASE_STORE_FILE: release.keystore
          TERMUX_RELEASE_STORE_PASSWORD: termux123
          TERMUX_RELEASE_KEY_ALIAS: termux-release
          TERMUX_RELEASE_KEY_PASSWORD: termux123
        run: |
          PKG_VARIANT="${{ matrix.variant == 'apt' && 'apt-android-7' || 'pacman-android-7' }}"
          echo "Building $PKG_VARIANT..."

          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x testDebugUnitTest -x lintDebug -x lintVitalDebug \
            -x verifyReleaseResources -x verifyReleaseHardening

          # Find the signed release APK
          APK=$(find app/build/outputs/apk/release -name "*-release.apk" | grep -v "unsigned" | head -1)
          if [ -z "$APK" ]; then
            find app/build -name "*.apk" | head -5
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" "artifacts/termux-app-${{ matrix.variant }}.apk"
          echo "✅ APK: artifacts/termux-app-${{ matrix.variant }}.apk ($(ls -lh artifacts/termux-app-${{ matrix.variant }}.apk | awk '{print $5}'))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: artifacts/termux-app-${{ matrix.variant }}.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release info
        id: info
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VERSION="${{ env.APP_VERSION }}"
          TAG="v${VERSION}-b${BUILD_NUMBER}"

          # Generate changelog from recent commits
          CHANGELOG=$(git log --oneline --no-merges -20 "${{ github.event.before }}".."${{ github.sha }}" 2>/dev/null || echo "No changelog available")

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          VERSION="${{ steps.info.outputs.version }}"
          SHA="${{ steps.info.outputs.sha }}"
          CHANGELOG="${{ steps.info.outputs.changelog }}"

          # Create release notes
          cat > release-notes.md <<- EOF
          ## Termux Split Screen v${VERSION} (build #${{ github.run_number }})

          **Commit:** ${SHA}

          ### Downloads
          | Variant | APK |
          |---------|-----|
          | APT | \`termux-app-apt.apk\` |
          | PACMAN | \`termux-app-pacman.apk\` |

          ### Changelog
          ${CHANGELOG}

          ---
          _Built by GitHub Actions #${{ github.run_number }}_
          EOF

          # Delete existing release with same tag (if any)
          gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true

          # Find APKs
          APT_APK=$(find dist -name "termux-app-apt.apk" -type f | head -1)
          PACMAN_APK=$(find dist -name "termux-app-pacman.apk" -type f | head -1)

          # Create release
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "v${VERSION} Build #${{ github.run_number }}" \
            --notes-file release-notes.md \
            "$APT_APK" "$PACMAN_APK"

          echo "✅ Release created: $TAG"

      - name: Cleanup old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all releases (excluding the one we just created)
          RELEASES=$(gh release list --repo ${{ github.repository }} --limit 50 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease | not) | .tagName' \
            | sort -V)
          COUNT=$(echo "$RELEASES" | wc -l)
          if [ "$COUNT" -gt 20 ]; then
            echo "$RELEASES" | head -n -20 | while read TAG; do
              echo "Deleting old release: $TAG"
              gh release delete "$TAG" --yes --repo ${{ github.repository }} || true
            done
          fi
