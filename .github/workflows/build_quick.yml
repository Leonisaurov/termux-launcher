name: Build quick (arm64-only)

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
      - 'dev'

concurrency:
  group: build-quick-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_APP_VERSION_NAME: ${{ vars.TERMUX_APP_VERSION_NAME || '0.2.29-hotfix.1' }}

jobs:
  build:
    strategy:
      matrix:
        package_variant: [apt-android-7, pacman-android-7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: app/release.keystore
          key: release-keystore-${{ runner.os }}

      - name: Create release keystore (if not exists)
        run: |
          KEYSTORE_FILE="app/release.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Creating release keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -alias termux-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass termux123 \
              -keypass termux123 \
              -dname "CN=Termux Split, OU=Development, O=Termux, L=Unknown, ST=Unknown, C=US"
            echo "Keystore created at $KEYSTORE_FILE"
          else
            echo "Keystore already exists, reusing for consistent signing"
          fi

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
          TERMUX_RELEASE_STORE_FILE: app/release.keystore
          TERMUX_RELEASE_STORE_PASSWORD: termux123
          TERMUX_RELEASE_KEY_ALIAS: termux-release
          TERMUX_RELEASE_KEY_PASSWORD: termux123
        run: |
          echo "Building with TERMUX_PACKAGE_VARIANT=$TERMUX_PACKAGE_VARIANT"
          echo "Using release keystore for consistent signing"
          
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x testDebugUnitTest -x lintDebug -x lintVitalDebug \
            -x verifyReleaseResources \
            -x verifyReleaseHardening
          
          VARIANT_SHORT="${TERMUX_PACKAGE_VARIANT%-android-7}"
          
          echo "Looking for APK..."
          APK_FILE=$(find app/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found"
            find app/build -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          mkdir -p app/build/outputs/apk/release
          cp "$APK_FILE" "app/build/outputs/apk/release/termux-app-$VARIANT_SHORT.apk"
          echo "APK ready: termux-app-$VARIANT_SHORT.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-${{ matrix.package_variant }}
          path: app/build/outputs/apk/release/termux-app-*.apk
          retention-days: 7

  create-release:
    needs: build
    if: github.ref_name != 'dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION_NAME="${{ env.TERMUX_APP_VERSION_NAME }}"
          BUILD_NUMBER=${{ github.run_number }}
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_TAG="v$RELEASE_VERSION_NAME-build-$BUILD_NUMBER"

          # Find all APKs
          APK_FILES=$(find apks -name "*.apk" -type f)

          if gh release view "$RELEASE_TAG" --repo ${{ github.repository }} &>/dev/null; then
            echo "Release $RELEASE_TAG already exists, uploading assets..."
            for apk in $APK_FILES; do
              gh release upload "$RELEASE_TAG" "$apk" --repo ${{ github.repository }} --clobber
            done
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              --repo ${{ github.repository }} \
              --title "v$RELEASE_VERSION_NAME Build #$BUILD_NUMBER" \
              --notes "## Build $BUILD_NUMBER
          - Commit: ${SHORT_SHA}
          - APT binary: \`termux-app-apt.apk\`
          - PACMAN binary: \`termux-app-pacman.apk\`

          ### Split Screen Feature
          - Split vertical/horizontal with Ctrl+B
          - Focus navigation, resize, zoom
          - Package Manager Switcher (Settings → Package Manager)" \
              --prerelease \
              $APK_FILES
          fi

          # Update rolling tag
          ROLLING_TAG="nightly-split-latest"
          if git ls-remote --tags origin "$ROLLING_TAG" | grep -q .; then
            gh release delete "$ROLLING_TAG" --yes --repo ${{ github.repository }} || true
          fi
          gh release create "$ROLLING_TAG" \
            --repo ${{ github.repository }} \
            --title "Nightly Split ($RELEASE_VERSION_NAME)" \
            --notes "Latest nightly build with both APT and PACMAN variants." \
            --prerelease \
            $(find apks -name "*.apk" -type f)

      - name: Cleanup old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --repo ${{ github.repository }} --limit 50 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -v "nightly" | sort -V)
          COUNT=$(echo "$RELEASES" | wc -l)
          if [ "$COUNT" -gt 10 ]; then
            echo "$RELEASES" | head -n -10 | while read TAG; do
              gh release delete "$TAG" --yes --repo ${{ github.repository }} || true
            done
          fi
