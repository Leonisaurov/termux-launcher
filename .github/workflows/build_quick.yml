name: Build quick (arm64-only)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/*
      - dev

concurrency:
  group: build-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ github.ref_name }}-
            gradle-${{ runner.os }}-main-
            gradle-${{ runner.os }}-

      - name: Build APK (arm64-v8a only, cached)
        shell: bash
        run: |
          set -euo pipefail

          echo "Setting version vars"
          GITHUB_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          CURRENT_VERSION_NAME="$(grep -m 1 -E '\s+versionName "[^"]+"$' ./app/build.gradle | sed -r 's/\s+versionName "([^"]+)"$/\1/')"
          if [[ "$CURRENT_VERSION_NAME" == *"+"* ]]; then
            RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}.${SHORT_SHA}"
          else
            RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}+${SHORT_SHA}"
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-apt-android-7-github-debug"
          APK_VERSION_TAG="${APK_VERSION_TAG//+/-}"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building APK for '$APK_VERSION_TAG'"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"

          ./gradlew \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            assembleDebug \
            -x testDebugUnitTest \
            -x lintDebug \
            -x lintVitalDebug \
            2>&1 || {
            echo "::error::Build failed"
            exit 1
          }

          echo "Validating APK"
          APK_FILE="${APK_BASENAME_PREFIX}_arm64-v8a.apk"
          if [ ! -f "$APK_DIR_PATH/$APK_FILE" ]; then
            echo "::warning::arm64-v8a APK not found"
            ls -la "$APK_DIR_PATH/" 2>/dev/null || echo "No APKs found"
            exit 1
          fi
          echo "✅ APK size: $(ls -lh "$APK_DIR_PATH/$APK_FILE" | awk '{print $5}')"

      - name: Rename and prepare APK
        shell: bash
        run: |
          APK_SRC="${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk"
          APK_DST="${{ env.APK_DIR_PATH }}/termux-app-split.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DST"
            echo "APK prepared: $(ls -lh "$APK_DST" | awk '{print $5}')"
          else
            echo "::error::APK not found at $APK_SRC"
            ls -la "${{ env.APK_DIR_PATH }}/" 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-split.apk
          path: ${{ env.APK_DIR_PATH }}/termux-app-split.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        shell: bash
        run: |
          echo "🧹 Cleaning up old nightly-split tags..."
          # Delete all old nightly-split-* tags (with sha) leaving only nightly-split-latest
          for tag in $(gh release list --repo ${{ github.repository }} --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null | grep 'nightly-split-' | grep -v 'nightly-split-latest' || true); do
            echo "  Deleting old: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            git push origin ":refs/tags/$tag" 2>/dev/null || true
          done

          echo "🗑️ Deleting old release and tag..."
          # Delete existing release (ignore errors if it doesn't exist)
          gh release delete nightly-split-latest --yes 2>/dev/null || echo "No old release to delete"
          # Delete existing tag locally and remotely
          git tag -d nightly-split-latest 2>/dev/null || true
          git push origin :refs/tags/nightly-split-latest 2>/dev/null || true

          # Clean local tags too
          git tag -l 'nightly-split-*' | grep -v 'nightly-split-latest' | xargs -r git tag -d 2>/dev/null || true
          
          echo "🏷️ Creating new tag and release..."
          # Create new tag
          git tag nightly-split-latest "${{ github.sha }}"
          git push origin nightly-split-latest
          
          # Create release (this also creates the tag if missing)
          gh release create nightly-split-latest \
            "${{ env.APK_DIR_PATH }}/termux-app-split.apk#termux-app-split.apk" \
            --repo ${{ github.repository }} \
            --title "Nightly Split (latest)" \
            --notes "Latest APK from ${{ github.ref_name }} branch. Build #${{ github.run_number }}" \
            # No --prerelease flag so it shows as a full release on the releases page
          
          echo "✅ Release created: full release, not prerelease"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
